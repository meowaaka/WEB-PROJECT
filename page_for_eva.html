<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    


    
    <script>
        let targetScrollY = window.pageYOffset;
        let currentScrollY = window.pageYOffset;
        let isWheelScrolling = false;

        function animateScroll() {
            if (isWheelScrolling) {
                const diff = targetScrollY - currentScrollY;
                if (Math.abs(diff) < 0.5)
                {
                    currentScrollY = targetScrollY;
                    isWheelScrolling = false;
                }
                else
                {
                    currentScrollY += diff * 0.12;
                }

                window.scrollTo(0, currentScrollY);
            } else {
                currentScrollY = window.pageYOffset;
                targetScrollY = window.pageYOffset;
            }
            requestAnimationFrame(animateScroll);
        }

        requestAnimationFrame(animateScroll);

        window.addEventListener('wheel', function (event)
        {
            event.preventDefault();
            const delta = event.deltaY || event.deltaX;
            if (Math.abs(delta) < 1) return;

            if (!isWheelScrolling) {
                currentScrollY = window.pageYOffset;
                targetScrollY = window.pageYOffset;
                isWheelScrolling = true;
            }

            const maxScroll = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
            targetScrollY += delta * 1.2;
            targetScrollY = Math.min(maxScroll, Math.max(0, targetScrollY));
        },
        {
            passive: false
        });

        window.addEventListener('touchstart', function () {
            isWheelScrolling = false;
        }, { passive: true });

        window.addEventListener('mousedown', function (event) {
            if (event.clientX >= document.documentElement.clientWidth) {
                isWheelScrolling = false;
            }
        });

        document.querySelectorAll('.block-nav').forEach(function (link)
        {
            link.addEventListener('click', function (event)
            {
                const targetId = this.getAttribute('href');
                const targetEl = document.querySelector(targetId);
                if (targetEl)
                {
                    event.preventDefault();
                    currentScrollY = window.pageYOffset;
                    const maxScroll = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
                    const rect = targetEl.getBoundingClientRect();
                    targetScrollY = Math.min(maxScroll, Math.max(0, window.pageYOffset + rect.top - 20));
                    isWheelScrolling = true;
                }
            });
        });
    </script>
</body>
</html>
