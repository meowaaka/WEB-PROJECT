<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style> 
        @import url('https://fonts.cdnfonts.com/css/bender');
        
        * 
        {
            margin: 0;
        }

        html
        {
            scroll-behavior: smooth;
        }
        
        header 
        {
            display: flex;
            flex-direction: row;
            justify-content: space-around;
            align-items: center;
            width: 100%;
            height: 140px;
            background: linear-gradient(to right, #fff6E8, #ffffff, #fff6E8);
            border-top: 5px solid;
            border-bottom: 5px solid;
            border-image: linear-gradient(to right, #ffdba5, #ffb348) 1;
        }

        header .logo
        {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 400px;
            height: 100px;
            margin: 20px;
        }

        header .language
        {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100px;
            height: 100px;
            margin: 20px;
        }

        .logo img 
        {
            width: 100px;
            height: 100px;
        }

        .logo h1
        {
            display: inline;
            font-family: 'Bender';
            font-weight: 700;
            font-size: 32px;
            color: #003659;
        }

        .language a
        {
            font-family: 'Bender';
            font-weight: 700;
            font-size: 32px;
            color: #003659;
        }

        header .authorisation
        {
            width: 420px;
            height: 100px;
            margin: 20px;
        }

        .backgroundvideo 
        {
            width: 100%;
            height: 1100px;
        }

        main 
        {
            display: flex;
            justify-content: center;
            background-color:#fff6E8;
            border-top: 5px solid;
            border-image: linear-gradient(to right, #ffdba5, #ffb348) 1;
            padding-top: 40px;
            width: 100%;
            height: 1955px;
        }

        .mainpage 
        {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            background-color: #fff6E8;
            width: 85%;
            height: 100%;
        }

        .leftside, .rightside
        {
            display: flex;
            justify-content: center;
            width: 22%;
            height: 100%;
        }

        .article 
        {
            width: 50%;
            height: 100%;
            border-radius: 10px;
        }

        .pages, .navigation 
        {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 75%;
            height: 70px;
            border-radius: 10px;
            background: linear-gradient(#ffdba5, #ffb348);
        }

        .pages h1 
        {
            font-family: 'Bender';
            font-weight: 700;
            font-size: 27px;
            color: #fff6E8;
        }

        .navigation
        {
            flex-direction: column;
            justify-content: flex-start;
            align-items: stretch;
            gap: 10px;
            height: auto;
            width: clamp(140px, 15vw, 210px);
            max-height: calc(100vh - 32px);
            overflow-y: auto;
            padding: 12px;
            box-sizing: border-box;
            position: sticky;
            top: 24px;
            box-shadow: 0 4px 14px rgb(0 54 89 / 18%);
        }

        .navigation h2
        {
            font-family: 'Bender';
            font-weight: 700;
            font-size: 21px;
            color: #fff6E8;
            text-align: center;
        }

        .navigation ol
        {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 0;
            list-style: none;
        }

        .navigation a
        {
            display: block;
            padding: 8px 10px;
            border: 2px solid #ff7b32;
            border-radius: 4px;
            color: #003659;
            background: #fff6E8;
            font-family: 'Bender', sans-serif;
            font-size: 15px;
            text-decoration: none;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .navigation a:hover,
        .navigation a:focus-visible
        {
            color: #fff6E8;
            background: #ff7b32;
            outline: 2px solid #003659;
            outline-offset: 2px;
        }

        .article section
        {
            min-height: 360px;
            padding: 20px;
            border-bottom: 2px solid #ffdba5;
            scroll-margin-top: 24px;
            outline: 2px solid transparent;
            outline-offset: -2px;
            transition: outline-color 0.8s ease;
        }

        .article section.navigation-highlight
        {
            outline-color: #ffb348;
        }

        @media (prefers-reduced-motion: reduce)
        {
            html
            {
                scroll-behavior: auto;
            }

            .article section
            {
                transition: none;
            }
        }

        @media (max-width: 760px)
        {
            main
            {
                height: auto;
                min-height: 100vh;
                box-sizing: border-box;
            }

            .mainpage
            {
                flex-direction: column;
                gap: 24px;
                width: 90%;
            }

            .leftside,
            .rightside,
            .article
            {
                width: 100%;
                height: auto;
            }

            .rightside
            {
                order: -1;
            }

            .navigation
            {
                position: static;
                width: min(94vw, 520px);
                max-height: none;
                padding: 8px;
                gap: 0;
            }

            .navigation h2
            {
                display: none;
            }

            .navigation ol
            {
                display: grid;
                grid-template-columns: repeat(4, minmax(0, 1fr));
                gap: 6px;
            }

            .navigation a
            {
                padding: 8px 4px;
                font-size: 13px;
                text-align: center;
            }

            .article section
            {
                min-height: 240px;
            }

        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <img src="https://cdn.discordapp.com/attachments/1572294424887697438/1572333258123911188/aaaaaa.png?ex=6afdfcf5&is=6afcab75&hm=1c238868a5867b79969a930d7125170fafe9ca000989529f1a89541210588faf&">
            <h1>Gaslight? No Thanks</h1>
        </div>
        <div class="language">
            <a name="language" id="UA">UA</a>
            <h1>/</h1>
            <a name="language" id="EN">EN</a>
        </div>
    </header>

    <div class="backgroundvideo">

    </div>

    <main> 
        <div class="mainpage">
            <div class="leftside">
                <div class="pages">
                    <h1>Сторінки</h1>
                </div>
            </div>
            <article class="article">
                <section id="article-block-1" tabindex="-1" aria-label="Блок 1 статті"></section>
                <section id="article-block-2" tabindex="-1" aria-label="Блок 2 статті"></section>
                <section id="article-block-3" tabindex="-1" aria-label="Блок 3 статті"></section>
                <section id="article-block-4" tabindex="-1" aria-label="Блок 4 статті"></section>
            </article>
            <div class="rightside">
                <nav class="navigation" aria-label="Навігація між блоками статті">
                    <h2>Навігація</h2>
                    <ol>
                        <li><a href="#article-block-1">Блок 1</a></li>
                        <li><a href="#article-block-2">Блок 2</a></li>
                        <li><a href="#article-block-3">Блок 3</a></li>
                        <li><a href="#article-block-4">Блок 4</a></li>
                    </ol>
                </nav>
            </div>
        </div>
    </main>

    <footer>

    </footer>

    <script>
        const navigation = document.querySelector('.navigation');
        let highlightedSection = null;
        let highlightTimeout;

        function clearHighlight()
        {
            if (highlightedSection)
            {
                highlightedSection.classList.remove('navigation-highlight');
                highlightedSection = null;
            }
        }

        function scheduleHighlightClear(delay)
        {
            clearTimeout(highlightTimeout);
            highlightTimeout = setTimeout(clearHighlight, delay);
        }

        navigation.addEventListener('click', function (event)
        {
            const link = event.target.closest('a[href^="#article-block-"]');
            if (!link) return;

            const section = document.querySelector(link.hash);
            if (!section) return;

            clearHighlight();
            highlightedSection = section;
            section.classList.add('navigation-highlight');
            scheduleHighlightClear(1000);
        });

        window.addEventListener('scroll', function ()
        {
            if (highlightedSection) scheduleHighlightClear(1150);
        }, { passive: true });
    </script>
</body>
</html>
