<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://fonts.cdnfonts.com/css/bender" rel="stylesheet">
    <style> 
        @import url('https://fonts.cdnfonts.com/css/bender');
        
        * 
        {
            margin: 0;
        }
        
        header 
        {
            display: flex;
            flex-direction: row;
            justify-content: space-around;
            align-items: center;
            width: 100%;
            height: 140px;
            background: linear-gradient(to right, #fff6E8, #ffffff, #fff6E8);
            border-top: 5px solid;
            border-bottom: 5px solid;
            border-image: linear-gradient(to right, #ffdba5, #ffb348) 1;
        }

        header .logo
        {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 400px;
            height: 100px;
            margin: 20px;
        }

        header .language
        {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100px;
            height: 100px;
            margin: 20px;
        }

        .logo img 
        {
            width: 100px;
            height: 100px;
        }

        .logo h1
        {
            display: inline;
            font-family: 'Bender';
            font-weight: 700;
            font-size: 32px;
            color: #003659;
        }

        .language a
        {
            font-family: 'Bender';
            font-weight: 700;
            font-size: 32px;
            color: #003659;
        }

        header .authorisation
        {
            width: 420px;
            height: 100px;
            margin: 20px;
        }

        .backgroundvideo 
        {
            width: 100%;
            height: 1100px;
        }

        main 
        {
            display: flex;
            justify-content: center;
            background-color:#fff6E8;
            border-top: 5px solid;
            border-image: linear-gradient(to right, #ffdba5, #ffb348) 1;
            padding-top: 40px;
            width: 100%;
            height: 1955px;
        }

        .mainpage 
        {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            background-color: #fff6E8;
            width: 85%;
            height: 100%;
        }

        .leftside, .rightside
        {
            display: flex;
            justify-content: center;
            width: 22%;
            height: 100%;
        }

        .article 
        {
            width: 50%;
            height: 100%;
            border-radius: 10px;
        }

        .pages, .navigation 
        {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 75%;
            height: 70px;
            border-radius: 10px;
            background: linear-gradient(#ffdba5, #ffb348);
        }

        .pages h1 
        {
            font-family: 'Bender';
            font-weight: 700;
            font-size: 27px;
            color: #fff6E8;
        }

        .navigation h1 
        {
            font-family: 'Bender';
            font-weight: 700;
            font-size: 27px;
            color: #fff6E8;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <img src="https://cdn.discordapp.com/attachments/1572294424887697438/1572333258123911188/aaaaaa.png?ex=6afdfcf5&is=6afcab75&hm=1c238868a5867b79969a930d7125170fafe9ca000989529f1a89541210588faf&">
            <h1>Gaslight? No Thanks</h1>
        </div>
        <div class="language">
            <a name="language" id="UA">UA</a>
            <h1>/</h1>
            <a name="language" id="EN">EN</a>
        </div>
    </header>

    <div class="backgroundvideo">

    </div>

    <main> 
        <div class="mainpage">
            <div class="leftside">
                <div class="pages">
                    <h1>Сторінки</h1>
                </div>
            </div>
            <div class="article"></div>
            <div class="rightside">
                <div class="navigation">
                    <h1>Навігація</h1>
                </div>
            </div>
        </div>
    </main>

    <footer>

    </footer>

    <script>
        let targetScrollY = window.pageYOffset;
        let currentScrollY = window.pageYOffset;

        function animateScroll() {
            const diff = targetScrollY - currentScrollY;
            if (Math.abs(diff) < 0.5)
 {
                currentScrollY = targetScrollY;
            }
 else
 {
                currentScrollY += diff * 0.12;
            }

            window.scrollTo(0, currentScrollY);
            requestAnimationFrame(animateScroll);
        }

        requestAnimationFrame(animateScroll);

        window.addEventListener('wheel', function (event)
 {
            event.preventDefault();
            const delta = event.deltaY || event.deltaX;
            if (Math.abs(delta) < 1) return;

            targetScrollY += delta * 1.2;
            targetScrollY = Math.max(0, targetScrollY);
        },
 {
 passive: false
 });
    </script>
</body>
</html>
